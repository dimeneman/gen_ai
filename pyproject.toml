[project]
name = "gen-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eman Gope", email = "gopeeman87@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "google-genai>=2.30.0",
    "huggingface-hub>=2.2.0",
    "langchain>=1.4.5",
    "langchain-google-genai>=4.4.1",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.65.0",
    "transformers>=5.19.0",
]

[project.scripts]
gen-ai = "gen_ai:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
